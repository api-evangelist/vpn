name: VPN
description: >-
  A VPN (Virtual Private Network) creates an encrypted tunnel between a user's device and a remote network, protecting
  data from interception and masking the user's IP address. VPN technology is widely used for secure remote access to
  corporate networks, protecting privacy on public Wi-Fi, and bypassing geographic content restrictions. This index
  documents VPN providers, protocols, and APIs relevant to the VPN technology landscape including NordVPN, OpenVPN,
  WireGuard, Tailscale, and cloud provider VPN services.
